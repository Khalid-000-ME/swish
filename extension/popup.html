<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bind</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #05070c; }
      body { width: 360px; height: 560px; overflow: hidden; }
      #frame { width: 100%; height: 100%; border: 0; display: block; }
      #fallback {
        display: none; padding: 20px 18px; color: #eef1fb;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      #fallback h1 { font-size: 15px; margin: 0 0 10px; }
      #fallback p { font-size: 12px; line-height: 1.55; color: #a7b0cc; margin: 0 0 12px; }
      .label { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #6b7394; margin-bottom: 5px; }
      input {
        width: 100%; background: rgba(0,0,0,.3); border: 1px solid rgba(238,243,255,.22);
        border-radius: 8px; padding: 8px 10px; color: #eef1fb; font-size: 12px;
        outline: none; font-family: ui-monospace, monospace;
      }
      input:focus { border-color: #4f7bf0; }
      button {
        width: 100%; margin-top: 8px; padding: 9px; border: 0; border-radius: 999px;
        background: #eef3ff; color: #05070c; font-size: 12px; font-weight: 600;
        cursor: pointer; font-family: inherit;
      }
      button:disabled { opacity: .5; cursor: default; }
      .note { font-size: 10px; color: #6b7394; margin-top: 7px; line-height: 1.45; }
      .bad { color: #f04f5c; } .ok { color: #33d17a; }
    </style>
  </head>
  <body>
    <!-- The wallet renders itself; this is only the frame around it, so
         there's one design system rather than two that drift apart. -->
    <iframe id="frame" title="Bind wallet"></iframe>

    <div id="fallback">
      <h1>Can't reach your wallet</h1>
      <p id="why">Start it with <code>npm run dev</code>, or point this at wherever it's running.</p>
      <div class="label">Wallet server</div>
      <input id="url" placeholder="http://localhost:3000" spellcheck="false" />
      <button id="save">Save &amp; retry</button>
      <div class="note" id="saveNote"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
